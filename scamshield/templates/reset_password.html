{% extends "base.html" %}
{% block title %}Choose a new password · ScamShield India{% endblock %}
{% block content %}
<section class="page-intro">
  <span class="eyebrow">ACCOUNT RECOVERY</span>
  <h1>Choose a new password.</h1>
</section>
<section class="form-card">
  <form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password">New password</label>
    <input type="password" name="password" id="password" autocomplete="new-password" minlength="12" maxlength="128" required>
    <label for="confirmation">Confirm new password</label>
    <input type="password" name="confirmation" id="confirmation" autocomplete="new-password" minlength="12" maxlength="128" required>
    <p class="form-help">Use at least 12 characters. Avoid reusing a password from another site.</p>
    <button class="button button-primary" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
