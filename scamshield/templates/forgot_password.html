{% extends "base.html" %}
{% block title %}Reset password · ScamShield India{% endblock %}
{% block content %}
<section class="page-intro">
  <span class="eyebrow">ACCOUNT RECOVERY</span>
  <h1>Reset your password.</h1>
  <p>Enter your account email. If it exists and email delivery is configured, we’ll send a time-limited reset link.</p>
</section>
<section class="form-card">
  <form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email address</label>
    <input type="email" name="email" id="email" autocomplete="email" maxlength="254" required>
    <button class="button button-primary" type="submit">Send reset link</button>
  </form>
</section>
{% endblock %}
